<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pátina da Estátua da Liberdade em RA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: cena 3D em tela cheia; uma folha de controle fixa embaixo com ano, quimica e linha do tempo. Mundo visual unico (porto a noite), tema unico por escolha. */
  --harbor:#0d1920;
  --harbor-2:#16303a;
  --sheet:rgba(13,25,32,.86);
  --line:rgba(190,220,215,.18);
  --ink:#e8efec;
  --ink-2:#9db3b0;
  --copper:#d0823f;
  --verdigris:#7cc1ab;
  --acid:#d3cf73;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:linear-gradient(180deg,#0b151b 0%,#1a3540 52%,#24454f 60%,#0f2229 61%,#0a1519 100%);
  color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
body.xr{background:transparent}
#cam,#photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#gest{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#ui > header,#ui > .sheet,#side,#toast{position:relative;pointer-events:auto}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 0}
.brand{display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand span{font-size:12px;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button,.filebtn{
  font:600 13px/1 var(--body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);
  border-radius:999px;padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
button:focus-visible,.filebtn:focus-within,input:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
button.primary{background:var(--copper);border-color:transparent;color:#1b0f06}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn{position:relative;display:inline-flex;align-items:center}

#side{position:absolute;right:12px;top:50%;transform:translateY(-70%);display:none;flex-direction:column;gap:8px;align-items:center}
#side button{width:44px;height:44px;padding:0;font-size:20px;border-radius:50%}
#side small{font-size:10px;color:var(--ink);text-align:center;text-shadow:0 1px 4px #000;max-width:64px;font-variant-numeric:tabular-nums}
body.ar #side{display:flex}

#toast{position:absolute;left:16px;right:16px;top:74px;margin:auto;max-width:440px;background:var(--sheet);border:1px solid var(--line);
  border-left:3px solid var(--copper);border-radius:10px;padding:10px 12px;font-size:13px;display:none}
#toast.on{display:block}

.sheet{background:var(--sheet);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0}
.head{display:flex;align-items:center;gap:12px}
#year{font-family:var(--display);font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;min-width:2.3em}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.stage b{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
#sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}
#formula{font-size:12.5px;color:var(--verdigris);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#play{width:44px;height:44px;padding:0;border-radius:50%;flex:none;font-size:15px}
#desc{margin:0;font-size:13px;color:var(--ink-2);min-height:4.2em;text-wrap:pretty}

.tl{display:flex;flex-direction:column;gap:2px}
#t{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
#t::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#d0823f 0%,#7a4a2a 7%,#35261f 22%,#4f8f76 45%,#7cc1ab 62%,#7cc1ab 100%)}
#t::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#d0823f 0%,#7a4a2a 7%,#35261f 22%,#4f8f76 45%,#7cc1ab 62%,#7cc1ab 100%)}
#t::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--ink);border:3px solid var(--harbor);margin-top:-9px;box-shadow:0 1px 6px rgba(0,0,0,.5)}
#t::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid var(--harbor)}
.ticks{position:relative;height:14px;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}

.procs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{padding:7px 11px;font-weight:500;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;background:transparent}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;border:1px solid var(--c)}
#ph{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
#ph b{color:var(--acid);font-weight:600}
@media (max-height:620px){#desc{display:none}#year{font-size:36px}}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<img id="photo" alt="">
<canvas id="gl"></canvas>

<div id="ui">
  <div id="gest" aria-hidden="true"></div>
  <header>
    <div class="brand"><b>Estátua da Liberdade</b><span id="mode">Modo 3D · arraste para girar</span></div>
    <div class="actions">
      <button id="btnAR" class="primary" type="button">Iniciar RA</button>
      <label class="filebtn" id="lblPhoto">Foto de fundo<input id="file" type="file" accept="image/*" capture="environment"></label>
    </div>
  </header>

  <div id="toast" role="status"></div>

  <div id="side">
    <button id="plus" type="button" aria-label="Aumentar">+</button>
    <small id="size">0,60 m</small>
    <button id="minus" type="button" aria-label="Diminuir">−</button>
    <button id="real" type="button" aria-label="Escala real" title="Escala real">1:1</button>
    <button id="repos" type="button" aria-label="Reposicionar à frente" title="Reposicionar">⌖</button>
  </div>

  <section class="sheet" aria-label="Linha do tempo">
    <div class="head">
      <div id="year">1886</div>
      <div class="stage"><b><i id="sw"></i><span id="stage">Cobre novo</span></b><span id="formula"></span></div>
      <button id="play" type="button" aria-label="Reproduzir linha do tempo">▶</button>
    </div>
    <p id="desc"></p>
    <div class="tl">
      <input id="t" type="range" min="0" max="1000" value="0" step="1" aria-label="Ano">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="procs">
      <button class="chip" id="cRain" type="button" aria-pressed="true" style="--c:#bcd3e6"><i></i>Chuva</button>
      <button class="chip" id="cSO2" type="button" aria-pressed="true" style="--c:#d3cf73"><i></i>SO₂</button>
      <button class="chip" id="cSea" type="button" aria-pressed="true" style="--c:#ffffff"><i></i>Maresia</button>
      <span id="ph">pH da chuva <b>5,0</b> (estim.)</span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
if(!window.THREE){$('desc').textContent='A biblioteca 3D não carregou. Verifique a conexão e recarregue a página.';return;}
var V3=THREE.Vector3, NOW=new Date().getFullYear();
function lin(hex){return new THREE.Color(hex).convertSRGBToLinear();}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function ramp(a,b,x){return clamp((x-a)/(b-a),0,1);}
function curve(pts,x){ for(var i=1;i<pts.length;i++){ if(x<=pts[i][0]){ var p=pts[i-1],q=pts[i]; return p[1]+(q[1]-p[1])*ramp(p[0],q[0],x);} } return pts[pts.length-1][1]; }

/* ---------- renderer ---------- */
var canvas=$('gl');
var renderer;
try{ renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true}); }
catch(e){ $('desc').textContent='Este navegador não disponibilizou WebGL, necessário para a cena 3D.'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,0);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.xr.enabled=true;

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,0.02,400);

/* ambiente procedural para os reflexos do cobre */
(function(){
  var es=new THREE.Scene();
  var g=new THREE.SphereGeometry(50,32,16), n=g.attributes.position.count, col=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var y=g.attributes.position.getY(i)/50, c;
    if(y>0){ var k=Math.pow(y,0.5); c=[1.25-0.75*k,1.25-0.6*k,1.3-0.35*k]; }
    else{ var k2=Math.min(1,-y*3); c=[0.9-0.6*k2,0.85-0.57*k2,0.8-0.55*k2]; }
    col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  es.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  var sun=new THREE.Mesh(new THREE.SphereGeometry(5,16,8),new THREE.MeshBasicMaterial({color:new THREE.Color(9,8.4,7.2)}));
  sun.position.set(-22,34,26); es.add(sun);
  var pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(es,0.03).texture;
  pm.dispose();
})();
var sunL=new THREE.DirectionalLight(0xfff1dc,1.1); sunL.position.set(-0.6,1,0.75); scene.add(sunL);
scene.add(new THREE.HemisphereLight(0xcfe3f2,0x40382c,0.35));

/* ---------- material com patina ---------- */
var U={
  uOx:{value:0},uDark:{value:0},uGreen:{value:0},uMature:{value:0},uStreak:{value:0},
  cCopper:{value:lin(0xd98a52)},cCuprite:{value:lin(0x8a4f2c)},cTenorite:{value:lin(0x2e221d)},
  cYoung:{value:lin(0x4a8a70)},cPatA:{value:lin(0x6fb59f)},cPatB:{value:lin(0x9fd4c2)},cStreak:{value:lin(0x2f4a44)}
};
var patinaMat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:0.3});
patinaMat.onBeforeCompile=function(sh){
  for(var k in U) sh.uniforms[k]=U[k];
  sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vOP;\nvarying vec3 vON;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\nvOP=position;\nvON=normal;');
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>',[
      '#include <common>',
      'varying vec3 vOP; varying vec3 vON;',
      'uniform float uOx,uDark,uGreen,uMature,uStreak;',
      'uniform vec3 cCopper,cCuprite,cTenorite,cYoung,cPatA,cPatB,cStreak;',
      'float pHash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }',
      'float pNoise(vec3 x){ vec3 i=floor(x); vec3 f=fract(x); f=f*f*(3.0-2.0*f);',
      ' return mix(mix(mix(pHash(i),pHash(i+vec3(1,0,0)),f.x),mix(pHash(i+vec3(0,1,0)),pHash(i+vec3(1,1,0)),f.x),f.y),',
      '            mix(mix(pHash(i+vec3(0,0,1)),pHash(i+vec3(1,0,1)),f.x),mix(pHash(i+vec3(0,1,1)),pHash(i+vec3(1,1,1)),f.x),f.y),f.z); }',
      'float pFbm(vec3 p){ float a=0.5; float s=0.0; for(int i=0;i<4;i++){ s+=a*pNoise(p); p=p*2.03+11.7; a*=0.5; } return clamp((s/0.9375-0.2)/0.6,0.0,1.0); }',
      'float pCover(float p,float n){ return smoothstep(0.0,0.22,p*1.22-n); }'
    ].join('\n'))
    .replace('#include <metalnessmap_fragment>',[
      '#include <metalnessmap_fragment>',
      'float n1=pFbm(vOP*0.22);',
      'float n2=pFbm(vOP*0.9+7.3);',
      'float n3=pFbm(vec3(vOP.x*1.3,vOP.y*0.09,vOP.z*1.3)+3.1);',
      'float nA=n1*0.6+n2*0.4;',
      'float expo=clamp(0.5+0.5*normalize(vON).y,0.0,1.0);',
      'float ox=pCover(uOx,nA);',
      'float dk=pCover(uDark,n2*0.6+n1*0.4);',
      'float gr=pCover(uGreen,clamp(nA*0.72+(1.0-expo)*0.28,0.0,1.0));',
      'vec3 pc=mix(cCopper,cCuprite,ox);',
      'pc=mix(pc,cTenorite,dk);',
      'vec3 pg=mix(cYoung,mix(cPatA,cPatB,n2),uMature);',
      'pc=mix(pc,pg,gr);',
      'float st=smoothstep(0.52,0.82,n3)*uStreak*gr;',
      'pc=mix(pc,cStreak,st*0.55);',
      'diffuseColor.rgb=pc;',
      'metalnessFactor=1.0-max(max(ox*0.55,dk*0.85),gr);',
      'roughnessFactor=mix(mix(mix(0.26,0.55,ox),0.8,dk),0.95,gr);'
    ].join('\n'));
};
var granite=new THREE.MeshStandardMaterial({color:lin(0x8f8676),roughness:0.92,metalness:0,flatShading:true});
var graniteDark=new THREE.MeshStandardMaterial({color:lin(0x5d564b),roughness:0.95,metalness:0,flatShading:true});
var glassMat=new THREE.MeshStandardMaterial({color:lin(0xffb44a),emissive:lin(0xff9326),emissiveIntensity:1.5,roughness:0.3,metalness:0});
var goldMat=new THREE.MeshStandardMaterial({color:lin(0xf0bd3a),roughness:0.22,metalness:1});

/* ---------- geometria ---------- */
function cyl(p1,p2,r1,r2,seg){
  var d=new V3().subVectors(p2,p1), len=d.length();
  var g=new THREE.CylinderGeometry(r2,r1,len,seg||16,1); g.translate(0,len/2,0);
  var q=new THREE.Quaternion().setFromUnitVectors(new V3(0,1,0),d.normalize());
  g.applyMatrix4(new THREE.Matrix4().compose(p1,q,new V3(1,1,1))); return g;
}
function sph(c,r,sx,sy,sz){ var g=new THREE.SphereGeometry(r,20,14); g.scale(sx||1,sy||1,sz||1); g.translate(c.x,c.y,c.z); return g; }
function v(x,y,z){return new V3(x,y,z);}
function merge(list){
  var n=0, parts=list.map(function(g){var t=g.index?g.toNonIndexed():g; n+=t.attributes.position.count; return t;});
  var pos=new Float32Array(n*3), nor=new Float32Array(n*3), o=0;
  parts.forEach(function(t){pos.set(t.attributes.position.array,o);nor.set(t.attributes.normal.array,o);o+=t.attributes.position.count*3;});
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(nor,3)); return g;
}
function tier(half0,half1,y0,y1){ var g=new THREE.CylinderGeometry(half1*Math.SQRT2,half0*Math.SQRT2,y1-y0,4,1); g.rotateY(Math.PI/4); g.translate(0,(y0+y1)/2,0); return g; }

var root=new THREE.Group(); scene.add(root);          // 1 unidade = 1 metro real; escala aplicada no root
var FEET=47, TOTAL=93;

/* pedestal e forte em estrela (granito, nao patina) */
(function(){
  var s=new THREE.Shape(), N=11;
  for(var i=0;i<N*2;i++){ var a=i/(N*2)*Math.PI*2, r=i%2?20:30; if(i===0) s.moveTo(Math.cos(a)*r,Math.sin(a)*r); else s.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
  var fort=new THREE.ExtrudeGeometry(s,{depth:7,bevelEnabled:false}); fort.rotateX(-Math.PI/2);
  root.add(new THREE.Mesh(fort,granite));
  var ped=merge([tier(15,14.5,7,11),tier(11.5,11,11,15),tier(10,8.6,15,39),tier(10.6,10.6,39,41),tier(9.4,9.4,41,42.6),tier(7.6,7.2,42.6,FEET)]);
  ped.computeVertexNormals();
  root.add(new THREE.Mesh(ped,granite));
  var niches=[];
  for(var k=0;k<4;k++){ var b=new THREE.BoxGeometry(9,9,0.6); b.translate(0,31,8.95); b.rotateY(k*Math.PI/2); niches.push(b);
    var d=new THREE.BoxGeometry(4,6,0.6); d.translate(0,18.5,9.75); d.rotateY(k*Math.PI/2); niches.push(d); }
  root.add(new THREE.Mesh(merge(niches),graniteDark));
})();

/* figura em cobre */
var statue=new THREE.Group(); statue.position.y=FEET; root.add(statue);
var flame;
(function(){
  var parts=[];
  // manto
  var prof=[[6.2,0],[6.0,1.5],[5.6,6],[5.3,12],[5.2,17],[5.0,21],[4.9,24],[4.3,26.3],[2.6,27.6],[1.3,28.4]].map(function(p){return new THREE.Vector2(p[0],p[1]);});
  var robe=new THREE.LatheGeometry(prof,72), P=robe.attributes.position;
  for(var i=0;i<P.count;i++){
    var x=P.getX(i),y=P.getY(i),z=P.getZ(i), th=Math.atan2(x,z), A=0.075-0.06*clamp(y/27,0,1);
    var f=1+A*Math.sin(th*11+y*0.22)+0.5*A*Math.sin(th*5-y*0.1+1.0);
    P.setXYZ(i,x*f,y,z*f*0.74);
  }
  robe.computeVertexNormals(); parts.push(robe);
  // faixa diagonal do manto e panejamento sob o braco esquerdo
  var sash=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([v(4.4,26.3,0.6),v(2.2,24,3.3),v(-1.5,21,3.8),v(-4.5,18,2.0),v(-5.3,15.5,0)]),28,0.8,10);
  parts.push(sash);
  var drape=new THREE.CylinderGeometry(1.4,2.3,12,16,1); drape.scale(1,1,0.55); drape.translate(5.5,14,1.3); parts.push(drape);
  // pescoco, cabeca, cabelo
  parts.push(cyl(v(0,27.4,0),v(0,29.6,0.1),1.25,1.05));
  parts.push(sph(v(0,31,0.1),1.55,1,1.6,1.1));
  parts.push(sph(v(0,31.5,-0.55),1.7,1.03,1.3,1.0));
  parts.push(sph(v(0,30.5,-1.9),0.85));
  parts.push(cyl(v(0,31.3,1.55),v(0,30.5,2.0),0.1,0.32,8));           // nariz
  // diadema e sete raios
  var band=new THREE.CylinderGeometry(1.78,1.72,0.75,24,1,true); band.rotateX(-0.22); band.translate(0,32.55,0.05); parts.push(band);
  for(var r=-3;r<=3;r++){ var a=r*25*Math.PI/180, dir=v(Math.sin(a),Math.cos(a)*0.97,-0.22-0.12*Math.abs(r)/3).normalize(), o=v(0,32.4,0);
    parts.push(cyl(o.clone().addScaledVector(dir,1.5),o.clone().addScaledVector(dir,4.9),0.34,0.03,8)); }
  // braco direito erguido (lado -x) e tocha
  var S=v(-4.2,25.6,0),E=v(-5.6,31.4,0.5),W=v(-5.8,37.0,0.8);
  parts.push(sph(S,2.1,1,0.9,0.85),cyl(S,E,1.7,1.35),sph(E,1.35),cyl(E,W,1.35,0.85),sph(v(-5.8,37.9,0.8),1.05));
  var tx=-5.8,tz=0.8;
  parts.push(cyl(v(tx,36.4,tz),v(tx,40.6,tz),0.5,0.75),cyl(v(tx,40.6,tz),v(tx,41.8,tz),0.75,1.7),cyl(v(tx,41.8,tz),v(tx,42.1,tz),2.15,2.15,20),cyl(v(tx,42.1,tz),v(tx,42.7,tz),1.1,1.25));
  var rail=new THREE.TorusGeometry(2.0,0.09,6,24); rail.rotateX(Math.PI/2); rail.translate(tx,43.0,tz); parts.push(rail);
  for(var q=0;q<10;q++){ var qa=q/10*Math.PI*2; parts.push(cyl(v(tx+Math.cos(qa)*2,42.1,tz+Math.sin(qa)*2),v(tx+Math.cos(qa)*2,43.0,tz+Math.sin(qa)*2),0.06,0.06,5)); }
  // braco esquerdo e tabua
  var S2=v(4.2,25.6,0),E2=v(5.9,20.2,0.8),W2=v(4.6,19.2,3.6);
  parts.push(sph(S2,2.1,1,0.9,0.85),cyl(S2,E2,1.7,1.4),sph(E2,1.4),cyl(E2,W2,1.4,0.9),sph(v(4.5,19.2,4.0),1.0));
  var tab=new THREE.BoxGeometry(4.14,7.19,0.61);
  tab.applyMatrix4(new THREE.Matrix4().compose(v(5.0,22.6,3.7),new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.2,-0.45,-0.12)),v(1,1,1)));
  parts.push(tab);
  statue.add(new THREE.Mesh(merge(parts),patinaMat));
  // chama (material muda com a epoca)
  var fp=[[1.15,0],[1.38,0.7],[1.22,1.5],[0.82,2.3],[0.42,3.0],[0.13,3.5],[0.0,3.75]].map(function(p){return new THREE.Vector2(p[0],p[1]);});
  var fg=new THREE.LatheGeometry(fp,20), F=fg.attributes.position;
  for(var j=0;j<F.count;j++){ var fx=F.getX(j),fy=F.getY(j),fz=F.getZ(j),ft=Math.atan2(fx,fz),ff=1+0.14*Math.sin(ft*4+fy*1.6); F.setXYZ(j,fx*ff+0.12*fy*fy*0.2,fy,fz*ff); }
  fg.computeVertexNormals();
  flame=new THREE.Mesh(fg,patinaMat); flame.position.set(tx,42.7,tz); statue.add(flame);
})();

/* base visual: sombra e ilha (ilha so no modo 3D) */
function radialTex(stops){ var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d'), g=x.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(function(s){g.addColorStop(s[0],s[1]);}); x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
var shadow=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshBasicMaterial({map:radialTex([[0,'rgba(0,0,0,.55)'],[.45,'rgba(0,0,0,.35)'],[1,'rgba(0,0,0,0)']]),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2; shadow.position.y=0.05; root.add(shadow);
var island=new THREE.Mesh(new THREE.CircleGeometry(62,48),new THREE.MeshStandardMaterial({color:lin(0x2b3a33),roughness:1,metalness:0}));
island.rotation.x=-Math.PI/2; island.position.y=-0.05; root.add(island);

/* ---------- processos: chuva, SO2, maresia ---------- */
var RN=420, rainPos=new Float32Array(RN*6), rainSeed=[];
for(var i=0;i<RN;i++) rainSeed.push([Math.random()*90-45,Math.random()*112,Math.random()*90-45,0.8+Math.random()*0.5]);
var rainGeo=new THREE.BufferGeometry(); rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
var rainMat=new THREE.LineBasicMaterial({color:0xbcd3e6,transparent:true,opacity:0.55,depthWrite:false});
var rain=new THREE.LineSegments(rainGeo,rainMat); rain.frustumCulled=false; root.add(rain);
var dot=radialTex([[0,'rgba(255,255,255,1)'],[.4,'rgba(255,255,255,.5)'],[1,'rgba(255,255,255,0)']]);
function cloud(n,y0,y1,size,color){
  var p=new Float32Array(n*3); for(var i=0;i<n;i++){p[i*3]=Math.random()*100-50;p[i*3+1]=y0+Math.random()*(y1-y0);p[i*3+2]=Math.random()*100-50;}
  var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  var m=new THREE.PointsMaterial({map:dot,color:color,size:size,transparent:true,opacity:0.4,depthWrite:false,sizeAttenuation:true});
  var o=new THREE.Points(g,m); o.frustumCulled=false; o.userData.base=size; root.add(o); return o;
}
var so2=cloud(110,58,104,7,0xc2ad2e), sea=cloud(170,2,48,2.2,0xffffff);
var colRain=new THREE.Color(0xbcd3e6), colAcid=new THREE.Color(0xd9d56a);

/* ---------- linha do tempo ---------- */
var STAGES=[
 {to:1887,name:'Cobre novo',sw:'#d98a52',f:'Cu metálico, chapas de 2,4 mm',
  d:'Cerca de 300 chapas de cobre marteladas sobre moldes (repoussé) e rebitadas à estrutura de ferro. Superfície metálica, cor de moeda nova.'},
 {to:1890,name:'Cuprita',sw:'#8a4f2c',f:'4 Cu + O₂ → 2 Cu₂O',
  d:'O oxigênio do ar forma óxido de cobre(I). O brilho metálico some em meses e o tom vai para o marrom avermelhado.'},
 {to:1898,name:'Tenorita e sulfetos',sw:'#2e221d',f:'2 Cu₂O + O₂ → 4 CuO',
  d:'A oxidação avança para óxido de cobre(II) e o enxofre do ar urbano forma sulfetos. A estátua fica marrom escuro, quase preta.'},
 {to:1920,name:'Formação da pátina',sw:'#4a8a70',f:'4 CuO + SO₃ + 3 H₂O → Cu₄SO₄(OH)₆ (brocantita)',
  d:'O SO₂ do carvão vira ácido sulfúrico na chuva e converte os óxidos em sulfato básico verde. O cloreto da maresia soma atacamita. Em 1906 cogitou-se pintá-la; a ideia foi abandonada.'},
 {to:1950,name:'Pátina estável',sw:'#7cc1ab',f:'Cu₄SO₄(OH)₆ + Cu₂Cl(OH)₃ (atacamita)',
  d:'Camada mineral com cerca de 0,1 mm, aderente e pouco solúvel, que isola o cobre e quase interrompe a corrosão. Desde 1916 a chama é de vidro âmbar iluminado.'},
 {to:1990,name:'Era da chuva ácida',sw:'#6aa392',f:'3 Cu₄SO₄(OH)₆ + H₂SO₄ → 4 Cu₃SO₄(OH)₄ + 2 H₂O',
  d:'Chuva com pH perto de 4 converte brocantita em antlerita, mais solúvel, que escorre e deixa estrias. Na restauração de 1984 a 1986 a tocha foi refeita com chama folheada a ouro.'},
 {to:9999,name:'Estado atual',sw:'#86c7b2',f:'pátina ≈ 0,1 mm sobre 2,4 mm de cobre',
  d:'Com o controle de emissões o SO₂ caiu e a chuva ficou menos ácida. A pátina segue estável e o cobre perdeu uma fração pequena da espessura desde 1886.'}
];
var POLL=[[1886,.35],[1920,.6],[1970,1],[1990,.75],[NOW,.2]], PH=[[1886,5.0],[1920,4.7],[1970,4.2],[1990,4.3],[NOW,5.1]];
var slider=$('t'), year=1886, poll=0.35, lastStage=-1;
function tToYear(t){ return t<0.6 ? 1886+(t/0.6)*34 : 1920+((t-0.6)/0.4)*(NOW-1920); }
function yearToT(y){ return y<1920 ? (y-1886)/34*0.6 : 0.6+(y-1920)/(NOW-1920)*0.4; }
(function(){ var h=''; [1886,1900,1920,1950,1986,NOW].forEach(function(y){ h+='<span style="left:'+(yearToT(y)*100).toFixed(1)+'%">'+y+'</span>'; }); $('ticks').innerHTML=h; })();
function applyYear(){
  year=tToYear(slider.value/1000);
  U.uOx.value=ramp(1886.2,1889.5,year);
  U.uDark.value=ramp(1888,1899,year);
  U.uGreen.value=ramp(1897,1919,year);
  U.uMature.value=ramp(1906,1926,year);
  U.uStreak.value=ramp(1930,1975,year)*(1-0.25*ramp(1990,NOW,year));
  flame.material = year<1916 ? patinaMat : (year<1986 ? glassMat : goldMat);
  poll=curve(POLL,year);
  rainMat.color.copy(colRain).lerp(colAcid,poll*0.9);
  so2.material.opacity=0.08+0.5*poll;
  var yi=Math.round(year); $('year').textContent=yi; slider.setAttribute('aria-valuetext',String(yi));
  $('ph').innerHTML='pH da chuva <b>'+curve(PH,year).toFixed(1).replace('.',',')+'</b> (estim.)';
  var si=0; while(year>=STAGES[si].to) si++;
  if(si!==lastStage){ lastStage=si; var s=STAGES[si]; $('stage').textContent=s.name; $('formula').textContent=s.f; $('desc').textContent=s.d; $('sw').style.background=s.sw; }
}
slider.addEventListener('input',function(){ stopPlay(); applyYear(); });
var playing=false;
function stopPlay(){ playing=false; $('play').textContent='▶'; }
$('play').addEventListener('click',function(){ if(playing){stopPlay();return;} if(+slider.value>=1000) slider.value=0; playing=true; $('play').textContent='❚❚'; });
function chip(id,obj){ $(id).addEventListener('click',function(){ var on=this.getAttribute('aria-pressed')!=='true'; this.setAttribute('aria-pressed',on); obj.visible=on; }); }
chip('cRain',rain); chip('cSO2',so2); chip('cSea',sea);

/* ---------- modos: 3D, camera+giroscopio, WebXR ---------- */
var mode='3d', scaleM=1, orbit={th:0.55,ph:1.32,r:2.75};
var hitSource=null, xrPlaced=false, gyro=null, gyroPlaced=false, gestureMoved=false;
var reticle=new THREE.Mesh(new THREE.RingGeometry(0.07,0.09,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x7cc1ab}));
reticle.matrixAutoUpdate=false; reticle.visible=false; scene.add(reticle);
function fmt(m){ return m>=10?Math.round(m)+' m':m.toFixed(2).replace('.',',')+' m'; }
function setScale(m){ scaleM=clamp(m,0.08,TOTAL); var s=scaleM/TOTAL; root.scale.setScalar(s); so2.material.size=so2.userData.base*s; sea.material.size=sea.userData.base*s;
  $('size').textContent=fmt(scaleM)+(scaleM>=TOTAL?'':' · 1:'+Math.round(TOTAL/scaleM)); }
function setMode(m){ mode=m; document.body.classList.toggle('ar',m!=='3d'); document.body.classList.toggle('xr',m==='xr'); island.visible=(m==='3d');
  $('mode').textContent = m==='3d'?'Modo 3D · arraste para girar' : m==='xr'?'RA · toque no chão para posicionar' : 'RA · câmera e giroscópio';
  $('btnAR').textContent = m==='3d'?'Iniciar RA':'Sair da RA'; }
function toast(msg,ms){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast.h); toast.h=setTimeout(function(){t.classList.remove('on');},ms||7000); }
function to3D(){ setMode('3d'); root.visible=true; root.position.set(0,0,0); root.rotation.set(0,0,0); setScale(1); reticle.visible=false; }

function stopCam(){ var vEl=$('cam'); if(vEl.srcObject){ vEl.srcObject.getTracks().forEach(function(t){t.stop();}); vEl.srcObject=null; } vEl.style.display='none';
  window.removeEventListener('deviceorientation',onOri); gyro=null; }
function onOri(e){ if(e.alpha==null&&e.beta==null) return; gyro={a:(e.alpha||0)*Math.PI/180,b:(e.beta||0)*Math.PI/180,g:(e.gamma||0)*Math.PI/180}; }
var qFix=new THREE.Quaternion(-Math.sqrt(0.5),0,0,Math.sqrt(0.5)), qScr=new THREE.Quaternion(), eul=new THREE.Euler(), zAx=new V3(0,0,1);
function placeInFront(){ var f=new V3(0,0,-1).applyQuaternion(camera.quaternion); f.y=0; if(f.lengthSq()<1e-4) f.set(0,0,-1); f.normalize();
  var d=Math.max(1.6,scaleM*2.2); root.position.set(camera.position.x+f.x*d,0,camera.position.z+f.z*d); root.rotation.set(0,Math.atan2(-f.x,-f.z),0); }

async function startAR(){
  // 1) WebXR com hit-test (Chrome no Android)
  var xrOK=false;
  try{ xrOK=!!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar')); }catch(e){}
  if(xrOK){
    try{
      var session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:$('ui')}});
      renderer.xr.setReferenceSpaceType('local');
      await renderer.xr.setSession(session);
      $('photo').style.display='none';
      setMode('xr'); xrPlaced=false; root.visible=false; setScale(0.6);
      session.requestReferenceSpace('viewer').then(function(vs){ return session.requestHitTestSource({space:vs}); }).then(function(h){ hitSource=h; }).catch(function(){ toast('Este aparelho não entregou detecção de superfícies.'); });
      session.addEventListener('end',function(){ hitSource=null; to3D(); });
      return;
    }catch(e){ /* cai para camera */ }
  }
  // 2) camera traseira + giroscopio (iOS e demais)
  var perm=null;
  try{ if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission) perm=DeviceOrientationEvent.requestPermission(); }catch(e){}
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('sem câmera');
    var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    var vEl=$('cam'); vEl.srcObject=stream; vEl.style.display='block'; $('photo').style.display='none'; try{ await vEl.play(); }catch(e){}
    if(perm){ try{ await perm; }catch(e){} }
    window.addEventListener('deviceorientation',onOri);
    setMode('cam'); gyroPlaced=false; camera.position.set(0,1.5,0); camera.quaternion.set(0,0,0,1); setScale(1.2); placeInFront();
    setTimeout(function(){ if(mode==='cam'&&!gyro) toast('Sem leitura do giroscópio: a estátua fica fixa na tela. Arraste para girar e use dois dedos para redimensionar.'); },2500);
  }catch(e){
    toast('A câmera não está disponível neste contexto. Abra esta página em HTTPS direto no navegador do celular e autorize a câmera. O modo 3D e a foto de fundo continuam funcionando.',12000);
  }
}
$('btnAR').addEventListener('click',function(){
  if(mode==='xr'){ var s=renderer.xr.getSession(); if(s) s.end(); return; }
  if(mode==='cam'){ stopCam(); to3D(); return; }
  startAR();
});
$('file').addEventListener('change',function(){ var f=this.files&&this.files[0]; if(!f) return; var img=$('photo'); if(img.src) URL.revokeObjectURL(img.src); img.src=URL.createObjectURL(f); img.style.display='block'; island.visible=false; });
$('plus').addEventListener('click',function(){ setScale(scaleM*1.3); });
$('minus').addEventListener('click',function(){ setScale(scaleM/1.3); });
$('real').addEventListener('click',function(){ setScale(scaleM>=TOTAL?0.6:TOTAL); if(mode==='cam') placeInFront(); });
$('repos').addEventListener('click',function(){ if(mode==='cam') placeInFront(); else if(mode==='xr'&&reticle.visible) placeAtReticle(); });
function placeAtReticle(){ root.position.setFromMatrixPosition(reticle.matrix); var c=new V3(); renderer.xr.getCamera(camera).getWorldPosition(c);
  root.rotation.set(0,Math.atan2(c.x-root.position.x,c.z-root.position.z),0); root.visible=true; xrPlaced=true; $('mode').textContent='RA · arraste para girar, dois dedos para escala'; }
var ctrl=renderer.xr.getController(0); scene.add(ctrl);
ctrl.addEventListener('select',function(){ if(gestureMoved) return; if(reticle.visible) placeAtReticle(); });
['header','.sheet','#side'].forEach(function(sel){ document.querySelector(sel).addEventListener('beforexrselect',function(e){ e.preventDefault(); }); });

/* gestos: um dedo gira, dois dedos aproximam ou redimensionam */
(function(){
  var el=$('gest'), pts=new Map(), lastD=0;
  function dist(){ var a=Array.from(pts.values()); return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
  el.addEventListener('pointerdown',function(e){ try{el.setPointerCapture(e.pointerId);}catch(_){} pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1) gestureMoved=false; if(pts.size===2) lastD=dist(); });
  el.addEventListener('pointermove',function(e){ var p=pts.get(e.pointerId); if(!p) return; var dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(Math.abs(dx)+Math.abs(dy)>2) gestureMoved=true;
    if(pts.size===1){ if(mode==='3d'){ orbit.th-=dx*0.008; orbit.ph=clamp(orbit.ph-dy*0.006,0.35,1.55); } else root.rotation.y+=dx*0.01; }
    else if(pts.size===2){ var d=dist(); if(lastD>0){ var k=d/lastD; if(mode==='3d') orbit.r=clamp(orbit.r/k,0.9,6); else setScale(scaleM*k); } lastD=d; gestureMoved=true; } });
  function up(e){ pts.delete(e.pointerId); lastD=0; }
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',function(e){ e.preventDefault(); if(mode==='3d') orbit.r=clamp(orbit.r*(1+e.deltaY*0.001),0.9,6); else setScale(scaleM*(1-e.deltaY*0.001)); },{passive:false});
})();

/* ---------- laco ---------- */
function resize(){ var w=window.innerWidth,h=window.innerHeight; if(renderer.xr.isPresenting) return; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=(mode==='cam')?(w<h?62:42):45; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
var clock=new THREE.Clock(), lastMode='';
renderer.setAnimationLoop(function(time,frame){
  var dt=Math.min(clock.getDelta(),0.05);
  if(mode!==lastMode){ lastMode=mode; resize(); }
  if(playing){ var nv=+slider.value+dt*1000/22; if(nv>=1000){ nv=1000; stopPlay(); } slider.value=nv; applyYear(); }
  // particulas (coordenadas locais do root)
  if(rain.visible){ for(var i=0;i<RN;i++){ var s=rainSeed[i]; s[1]-=75*s[3]*dt; s[0]+=6*dt; if(s[1]<0){ s[1]=110; s[0]=Math.random()*90-45; }
    var o=i*6; rainPos[o]=s[0]; rainPos[o+1]=s[1]; rainPos[o+2]=s[2]; rainPos[o+3]=s[0]+0.3; rainPos[o+4]=s[1]+3.2; rainPos[o+5]=s[2]; } rainGeo.attributes.position.needsUpdate=true; }
  [so2,sea].forEach(function(c,ci){ if(!c.visible) return; var a=c.geometry.attributes.position, sp=ci?7:3; for(var i=0;i<a.count;i++){ var x=a.getX(i)+sp*dt; if(x>50) x-=100; a.setX(i,x); if(ci) a.setY(i,a.getY(i)+Math.sin(time*0.001+i)*0.02); } a.needsUpdate=true; });

  if(mode==='3d'){
    var ty=0.22; camera.position.set(orbit.r*Math.sin(orbit.ph)*Math.sin(orbit.th),ty+orbit.r*Math.cos(orbit.ph),orbit.r*Math.sin(orbit.ph)*Math.cos(orbit.th)); camera.lookAt(0,ty,0);
  }else if(mode==='cam'&&gyro){
    var so=(screen.orientation&&screen.orientation.angle||window.orientation||0)*Math.PI/180;
    eul.set(gyro.b,gyro.a,-gyro.g,'YXZ'); camera.quaternion.setFromEuler(eul).multiply(qFix).multiply(qScr.setFromAxisAngle(zAx,-so));
    if(!gyroPlaced){ gyroPlaced=true; placeInFront(); }
  }else if(mode==='xr'&&frame&&hitSource){
    var hits=frame.getHitTestResults(hitSource), ref=renderer.xr.getReferenceSpace();
    if(hits.length&&ref){ var pose=hits[0].getPose(ref); if(pose){ reticle.visible=true; reticle.matrix.fromArray(pose.transform.matrix); } } else reticle.visible=false;
  }
  renderer.render(scene,camera);
});
to3D(); applyYear(); resize();
})();
</script>
